name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm install

      - name: Android projesi oluştur
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#0d0b14' --splashBackgroundColor '#0d0b14' || echo "ikon üretimi atlandı"
          # titreşim izni
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Sabit imza anahtarı (güncellemelerde verilerin silinmemesi için)
        run: |
          mkdir -p ~/.android
          cp android-keys/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Dopamed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dopamed-apk
          path: Dopamed.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dopamed v1.0.${{ github.run_number }}
          body: "Telefona indir: Dopamed.apk → aç → 'bilinmeyen kaynaklara izin ver'. Güncellemeler eski sürümün üzerine kurulur, ilerlemen silinmez."
          files: Dopamed.apk
